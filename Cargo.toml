[workspace]
members = ["server/backend", "server/frontend", "shared", "client/cli", "client/desktop", "client/local"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.2.0"
rust-version = "1.94"

[workspace.dependencies]
savhub-shared = { path = "shared" }
savhub-local = { path = "client/local" }

# Version policy: prefer `major.minor` ranges so cargo can pick up patch-level
# fixes (CVEs, soundness fixes) automatically. Pin to a specific patch only
# when there is a known compatibility constraint, and document the reason.

# -- Shared across server & client --
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
dialoguer = "0.12"
directories = "6.0"
# Dioxus 0.7.x is API-compatible within the minor; pin to minor to avoid 0.8.
dioxus = "0.7"
dioxus-router = "0.7"
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1.52", features = ["full"] }
toml = "1.1"
uuid = { version = "1.23", features = ["serde", "v4", "v7", "js"] }
walkdir = "2.5"
zip = { version = "8.5", default-features = false, features = ["deflate"] }

# -- Server-only --
ammonia = "4.1"
base64 = "0.22"
# Sync `diesel` is retained only for its derive macros (Queryable/Insertable/
# etc.) and for running embedded migrations at startup via a one-shot
# `PgConnection`. All runtime queries go through `diesel-async` below.
diesel = { version = "2.3", features = [
    "postgres", "chrono", "uuid", "serde_json", "64-column-tables",
] }
# C2: all runtime DB access uses diesel-async + a bb8 connection pool.
diesel-async = { version = "0.8", features = ["postgres", "bb8"] }
diesel_migrations = "2.3"
dotenvy = "0.15"
futures-util = "0.3"
indexmap = { version = "2.14", features = ["serde"] }
novel-core = { git = "https://github.com/taidge/novel.git", branch = "main" }
novel-shared = { git = "https://github.com/taidge/novel.git", branch = "main" }
once_cell = "1.21"
pq-sys = { version = "0.7", features = ["bundled"] }
pulldown-cmark = "0.13"
rust-embed = { version = "8.11", features = ["interpolate-folder-path"] }
salvo = { version = "0.92", features = ["cors", "websocket", "serve-static"] }
serde-saphyr = "0.0.23"  # pre-1.0: 0.0.x is one breaking step per patch, pin exact.
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# -- Web frontend --
gloo-timers = { version = "0.4", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "History", "WebSocket", "MessageEvent", "Navigator", "Clipboard"] }

# -- Client-only --
arboard = "3.6"
crossterm = "0.29"
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["png"] }
ratatui = "0.30"
rfd = "0.17"
self_update_tar = { package = "tar", version = "0.4" }
winresource = "0.1"
